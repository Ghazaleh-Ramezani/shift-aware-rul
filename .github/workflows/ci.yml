name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and the package
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests (synthetic data, no download needed)
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Build a small model bundle on synthetic data
        run: python scripts/container_smoke.py bundle --out model
      - name: Build the SageMaker inference image
        run: docker build -f serving/Dockerfile -t shift-aware-rul .
      - name: Serve it the way SageMaker does (model in /opt/ml/model, argument "serve")
        run: docker run -d --name rul -p 8080:8080 -v "$PWD/model:/opt/ml/model:ro" shift-aware-rul serve
      - name: SageMaker contract checks (/ping, JSON and CSV /invocations, drift routing, 400s)
        run: python scripts/container_smoke.py check --url http://localhost:8080
      - if: failure()
        run: docker logs rul

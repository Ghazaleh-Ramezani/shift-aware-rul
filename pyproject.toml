[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-aware-rul"
version = "0.1.0"
description = "Calibrated remaining-useful-life prediction under operating-condition shift"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ghazaleh Ramezani"}]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "pyyaml", "matplotlib"]

[project.optional-dependencies]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
aws = ["boto3>=1.34,<2"]
dev = ["pytest", "httpx", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "boto3>=1.34,<2",
       "moto[s3,sagemaker,cloudwatch]>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
